<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 戰術看板</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        /* 修正：允許網頁正常捲動，防止按鈕被遮擋 */
        body { 
            margin: 0; 
            padding: 0; 
            background: #000; 
            color: #fff; 
            font-family: sans-serif; 
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
        }
        #status-bar { 
            padding: 15px; 
            font-size: 16px; 
            background: #1a1a1a; 
            color: #0f0; 
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        #output { 
            flex-grow: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            font-size: 4rem; /* 稍微縮小一點點確保平板橫放也能看見 */
            font-weight: bold; 
            padding: 40px 20px; 
            line-height: 1.3; 
            word-break: break-all;
            min-height: 200px; /* 確保內容區塊有基本高度 */
        }
        .controls { 
            padding: 30px; 
            background: #1a1a1a; 
            display: flex; 
            justify-content: center;
            border-top: 1px solid #333;
        }
        button { 
            padding: 20px 50px; 
            font-size: 1.8rem; 
            cursor: pointer; 
            border-radius: 50px; 
            border: none; 
            background: #007bff; 
            color: white; 
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,123,255,0.3);
        }
        button:active { transform: scale(0.98); }
        button:disabled { background: #444; color: #888; }
        .progress-container { width: 100%; height: 6px; background: #333; position: fixed; top: 0; z-index: 20; }
        #progress-bar { width: 0%; height: 100%; background: #007bff; transition: width 0.3s; }
    </style>
</head>
<body>

    <div class="progress-container"><div id="progress-bar"></div></div>
    <div id="status-bar">系統準備就緒</div>
    
    <div id="output">點擊下方按鈕<br>開啟 AI 聽取</div>

    <div class="controls">
        <button id="start-btn">載入模型並啟動</button>
    </div>

    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

        const statusBar = document.getElementById('status-bar');
        const output = document.getElementById('output');
        const btn = document.getElementById('start-btn');
        const progressBar = document.getElementById('progress-bar');

        let transcriber;

        async function init() {
            btn.disabled = true;
            statusBar.innerText = "📥 下載模型中 (約 75MB)...";

            try {
                transcriber = await pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny', {
                    progress_callback: (p) => {
                        if (p.status === 'progress') progressBar.style.width = p.progress + '%';
                        if (p.status === 'ready') statusBar.innerText = "✅ 模型已就緒";
                    }
                });

                startRecording();
            } catch (err) {
                statusBar.innerText = "❌ 失敗: " + err.message;
                btn.disabled = false;
            }
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const audioContext = new AudioContext({ sampleRate: 16000 });
                const source = audioContext.createMediaStreamSource(stream);
                const processor = audioContext.createScriptProcessor(4096, 1, 1);

                source.connect(processor);
                processor.connect(audioContext.destination);

                let audioBuffer = [];
                statusBar.innerText = "🎤 聆聽中...";
                btn.innerText = "連動辨識中";
                output.innerText = "請教練開始說話...";

                processor.onaudioprocess = async (e) => {
                    const inputData = e.inputBuffer.getChannelData(0);
                    audioBuffer.push(...inputData);

                    if (audioBuffer.length > 16000 * 2.5) {
                        const tensorData = new Float32Array(audioBuffer);
                        audioBuffer = []; 

                        const result = await transcriber(tensorData, {
                            language: 'chinese',
                            task: 'transcribe'
                        });

                        if (result.text.trim()) {
                            // 修正：Whisper 有時會輸出簡體，加上簡易過濾或確保顯示
                            output.innerText = result.text;
                        }
                    }
                };
            } catch (e) {
                statusBar.innerText = "❌ 麥克風權限被拒絕";
            }
        }

        btn.onclick = init;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
